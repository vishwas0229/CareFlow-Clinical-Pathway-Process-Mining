
version: 2

models:
  - name: fct_careflow_event_log
    description: "Normalized event log for CareFlow process mining."
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique

      - name: case_id
        data_tests:
          - not_null

      - name: activity_name
        data_tests:
          - not_null

      - name: event_timestamp
        data_tests:
          - not_null
